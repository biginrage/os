<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>VELOX OS — Design Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;width:100%}
body{background:#040810;font-family:'Syne',sans-serif;color:#fff;overflow:hidden}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:rgba(255,255,255,0.02)}
::-webkit-scrollbar-thumb{background:rgba(0,220,180,0.25);border-radius:2px}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.85)}}
@keyframes fadeSlide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fs{animation:fadeSlide 0.3s ease both}
button{font-family:'DM Mono',monospace;cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
const AC="#00dcb4";
const sections=[
  {id:"vision",label:"01 Vision",icon:"◈"},
  {id:"architecture",label:"02 Architecture",icon:"⬡"},
  {id:"ux",label:"03 UX Design",icon:"◎"},
  {id:"smoothness",label:"04 Smoothness",icon:"∿"},
  {id:"ai",label:"05 AI Layer",icon:"⟁"},
  {id:"audio",label:"06 Audio/Visual",icon:"◉"},
  {id:"hardware",label:"07 Hardware",icon:"▣"},
  {id:"ecosystem",label:"08 Ecosystem",icon:"⬘"},
  {id:"security",label:"09 Security",icon:"⬟"},
  {id:"business",label:"10 Business",icon:"◆"},
  {id:"roadmap",label:"11 Roadmap",icon:"→"},
  {id:"execution",label:"12 Execution",icon:"✦"},
];

const Chip=({children,accent=false})=>(
  <span style={{display:"inline-block",padding:"3px 10px",borderRadius:"4px",fontSize:"11px",fontFamily:"'DM Mono',monospace",letterSpacing:"0.08em",background:accent?"rgba(0,220,180,0.12)":"rgba(255,255,255,0.06)",border:`1px solid ${accent?"rgba(0,220,180,0.35)":"rgba(255,255,255,0.1)"}`,color:accent?AC:"rgba(255,255,255,0.55)",marginRight:"6px",marginBottom:"6px"}}>{children}</span>
);
const Tag=({children})=>(
  <div style={{display:"inline-flex",alignItems:"center",padding:"6px 12px",borderRadius:"6px",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",fontSize:"12px",color:"rgba(255,255,255,0.6)",marginRight:"8px",marginBottom:"8px",fontFamily:"'DM Mono',monospace"}}>{children}</div>
);
const H=({children})=><span style={{color:AC,fontWeight:"600"}}>{children}</span>;
const Card=({children,accent=false,glow=false,style={}})=>(
  <div style={{background:accent?"rgba(0,220,180,0.05)":"rgba(255,255,255,0.03)",border:`1px solid ${accent?"rgba(0,220,180,0.2)":"rgba(255,255,255,0.07)"}`,borderRadius:"12px",padding:"24px",boxShadow:glow?"0 0 40px rgba(0,220,180,0.08)":"none",...style}}>{children}</div>
);
const SH=({number,title,subtitle})=>(
  <div style={{marginBottom:"40px"}}>
    <div style={{fontFamily:"'DM Mono',monospace",fontSize:"11px",color:AC,letterSpacing:"0.2em",marginBottom:"10px"}}>SECTION {number}</div>
    <h2 style={{fontSize:"clamp(22px,4vw,38px)",fontWeight:"700",fontFamily:"'Syne',sans-serif",background:"linear-gradient(135deg,#ffffff 0%,rgba(255,255,255,0.6) 100%)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",margin:"0 0 10px 0",lineHeight:"1.1"}}>{title}</h2>
    {subtitle&&<p style={{color:"rgba(255,255,255,0.4)",fontSize:"13px",fontFamily:"'DM Mono',monospace",letterSpacing:"0.04em",margin:0}}>{subtitle}</p>}
  </div>
);
const Bar=({label,value,color=AC})=>(
  <div style={{marginBottom:"13px"}}>
    <div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px"}}>
      <span style={{fontSize:"10px",color:"rgba(255,255,255,0.45)",fontFamily:"'DM Mono',monospace"}}>{label}</span>
      <span style={{fontSize:"10px",color,fontFamily:"'DM Mono',monospace"}}>{value}%</span>
    </div>
    <div style={{height:"2px",background:"rgba(255,255,255,0.06)",borderRadius:"2px",overflow:"hidden"}}>
      <div style={{height:"100%",width:`${value}%`,background:color,borderRadius:"2px",boxShadow:`0 0 8px ${color}80`}}/>
    </div>
  </div>
);
const AN=({label,sub,x,y,accent})=>(
  <div style={{position:"absolute",left:x,top:y,transform:"translate(-50%,-50%)",background:accent?"rgba(0,220,180,0.12)":"rgba(255,255,255,0.05)",border:`1px solid ${accent?"rgba(0,220,180,0.4)":"rgba(255,255,255,0.12)"}`,borderRadius:"8px",padding:"8px 13px",textAlign:"center",minWidth:"100px",boxShadow:accent?"0 0 20px rgba(0,220,180,0.15)":"none"}}>
    <div style={{fontSize:"11px",fontWeight:"700",color:accent?AC:"rgba(255,255,255,0.85)",fontFamily:"'Syne',sans-serif"}}>{label}</div>
    {sub&&<div style={{fontSize:"9px",color:"rgba(255,255,255,0.35)",fontFamily:"'DM Mono',monospace",marginTop:"2px"}}>{sub}</div>}
  </div>
);

const MockUI=()=>{
  const [time,setTime]=useState(new Date());
  const [speed,setSpeed]=useState(68);
  const [tab,setTab]=useState("home");
  useEffect(()=>{
    const t=setInterval(()=>setTime(new Date()),1000);
    const s=setInterval(()=>setSpeed(p=>Math.max(50,Math.min(95,p+(Math.random()-.5)*4))),2000);
    return()=>{clearInterval(t);clearInterval(s)};
  },[]);
  const hh=time.getHours().toString().padStart(2,"0");
  const mm=time.getMinutes().toString().padStart(2,"0");
  return(
    <div style={{width:"100%",aspectRatio:"16/7",background:"linear-gradient(160deg,#050a12 0%,#080e18 60%,#060b10 100%)",borderRadius:"16px",overflow:"hidden",border:"1px solid rgba(255,255,255,0.08)",display:"flex",boxShadow:"0 40px 80px rgba(0,0,0,0.6),0 0 0 1px rgba(0,220,180,0.05)",fontFamily:"'Syne',sans-serif"}}>
      <div style={{width:"26%",borderRight:"1px solid rgba(255,255,255,0.05)",padding:"16px 14px",display:"flex",flexDirection:"column",gap:"12px",background:"rgba(0,0,0,0.3)"}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:"8px",color:"rgba(255,255,255,0.3)",letterSpacing:"0.15em",fontFamily:"'DM Mono',monospace",marginBottom:"3px"}}>KM/H</div>
          <div style={{fontSize:"clamp(22px,5vw,40px)",fontWeight:"800",color:"#fff",lineHeight:1,textShadow:"0 0 30px rgba(0,220,180,0.3)",transition:"all 0.6s ease"}}>{Math.round(speed)}</div>
          <div style={{fontSize:"8px",color:AC,letterSpacing:"0.1em",fontFamily:"'DM Mono',monospace",marginTop:"3px"}}>VELOX DRIVE</div>
        </div>
        <div style={{height:"1px",background:"rgba(255,255,255,0.05)"}}/>
        <div>
          <div style={{fontSize:"7px",color:"rgba(255,255,255,0.25)",letterSpacing:"0.12em",marginBottom:"5px",fontFamily:"'DM Mono',monospace"}}>BATTERY</div>
          <div style={{height:"3px",background:"rgba(255,255,255,0.06)",borderRadius:"2px",overflow:"hidden"}}>
            <div style={{width:"73%",height:"100%",background:`linear-gradient(90deg,${AC},#00b090)`,borderRadius:"2px",boxShadow:"0 0 8px rgba(0,220,180,0.5)"}}/>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:"3px"}}>
            <span style={{fontSize:"8px",color:AC,fontFamily:"'DM Mono',monospace"}}>73%</span>
            <span style={{fontSize:"8px",color:"rgba(255,255,255,0.3)",fontFamily:"'DM Mono',monospace"}}>~218km</span>
          </div>
        </div>
        <div style={{height:"1px",background:"rgba(255,255,255,0.05)"}}/>
        <div style={{display:"flex",gap:"6px"}}>
          {["ECO","AWD","ABS"].map(i=>(
            <div key={i} style={{flex:1,textAlign:"center",padding:"3px",borderRadius:"4px",fontSize:"7px",fontFamily:"'DM Mono',monospace",background:i==="ECO"?"rgba(0,220,180,0.15)":"rgba(255,255,255,0.04)",border:`1px solid ${i==="ECO"?"rgba(0,220,180,0.4)":"rgba(255,255,255,0.07)"}`,color:i==="ECO"?AC:"rgba(255,255,255,0.3)"}}>{i}</div>
          ))}
        </div>
      </div>
      <div style={{flex:1,display:"flex",flexDirection:"column"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 16px",borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
          <div style={{fontSize:"9px",color:"rgba(255,255,255,0.4)",fontFamily:"'DM Mono',monospace"}}>SAN FRANCISCO — 72°F</div>
          <div style={{fontSize:"12px",fontWeight:"700",color:"rgba(255,255,255,0.8)"}}>{hh}:{mm}</div>
          <div style={{display:"flex",gap:"8px"}}>
            <span style={{fontSize:"8px",color:AC,fontFamily:"'DM Mono',monospace"}}>5G ●</span>
            <span style={{fontSize:"8px",color:"rgba(255,255,255,0.3)",fontFamily:"'DM Mono',monospace"}}>GPS ●</span>
          </div>
        </div>
        <div style={{display:"flex",borderBottom:"1px solid rgba(255,255,255,0.04)",padding:"0 14px"}}>
          {["home","nav","music","climate"].map(t=>(
            <button key={t} onClick={()=>setTab(t)} style={{padding:"7px 12px",border:"none",background:"none",fontSize:"9px",fontFamily:"'DM Mono',monospace",letterSpacing:"0.1em",color:tab===t?AC:"rgba(255,255,255,0.25)",borderBottom:`2px solid ${tab===t?AC:"transparent"}`,marginBottom:"-1px",textTransform:"uppercase",transition:"all 0.2s ease"}}>{t}</button>
          ))}
        </div>
        <div style={{flex:1,padding:"13px 15px",overflow:"hidden"}}>
          {tab==="home"&&(
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",height:"100%"}}>
              <div style={{gridRow:"span 2",background:"rgba(0,220,180,0.05)",borderRadius:"10px",border:"1px solid rgba(0,220,180,0.12)",padding:"12px",display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
                <div style={{fontSize:"8px",color:"rgba(255,255,255,0.3)",fontFamily:"'DM Mono',monospace"}}>AI COPILOT</div>
                <div>
                  <div style={{fontSize:"10px",color:"rgba(255,255,255,0.7)",lineHeight:"1.5",marginBottom:"8px"}}>"Traffic on I-280 ahead. Rerouting via CA-85 saves 8 min."</div>
                  <div style={{display:"flex",gap:"6px"}}>
                    <div style={{padding:"3px 8px",borderRadius:"4px",background:"rgba(0,220,180,0.15)",border:"1px solid rgba(0,220,180,0.3)",fontSize:"8px",color:AC,fontFamily:"'DM Mono',monospace"}}>REROUTE</div>
                    <div style={{padding:"3px 8px",borderRadius:"4px",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",fontSize:"8px",color:"rgba(255,255,255,0.4)",fontFamily:"'DM Mono',monospace"}}>DISMISS</div>
                  </div>
                </div>
              </div>
              <div style={{background:"rgba(255,255,255,0.03)",borderRadius:"10px",border:"1px solid rgba(255,255,255,0.06)",padding:"10px"}}>
                <div style={{fontSize:"8px",color:"rgba(255,255,255,0.25)",fontFamily:"'DM Mono',monospace",marginBottom:"5px"}}>NOW PLAYING</div>
                <div style={{fontSize:"10px",color:"rgba(255,255,255,0.8)"}}>Darkside</div>
                <div style={{fontSize:"9px",color:"rgba(255,255,255,0.3)",fontFamily:"'DM Mono',monospace"}}>Alan Walker</div>
              </div>
              <div style={{background:"rgba(255,255,255,0.03)",borderRadius:"10px",border:"1px solid rgba(255,255,255,0.06)",padding:"10px"}}>
                <div style={{fontSize:"8px",color:"rgba(255,255,255,0.25)",fontFamily:"'DM Mono',monospace",marginBottom:"5px"}}>CLIMATE</div>
                <div style={{fontSize:"20px",fontWeight:"700",color:"#fff"}}>22°</div>
                <div style={{fontSize:"8px",color:AC,fontFamily:"'DM Mono',monospace"}}>AUTO ●</div>
              </div>
            </div>
          )}
          {tab==="nav"&&(
            <div style={{height:"100%",display:"flex",flexDirection:"column",gap:"8px"}}>
              <div style={{flex:1,borderRadius:"10px",background:"linear-gradient(135deg,#0a1520,#0d1f2d)",border:"1px solid rgba(255,255,255,0.06)",position:"relative",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden"}}>
                <svg width="100%" height="100%" style={{position:"absolute",opacity:0.13}}>
                  {[...Array(8)].map((_,i)=><line key={`h${i}`} x1="0" y1={`${i*14}%`} x2="100%" y2={`${i*14}%`} stroke={AC} strokeWidth="0.5"/>)}
                  {[...Array(12)].map((_,i)=><line key={`v${i}`} x1={`${i*9}%`} y1="0" x2={`${i*9}%`} y2="100%" stroke={AC} strokeWidth="0.5"/>)}
                  <line x1="20%" y1="70%" x2="80%" y2="30%" stroke={AC} strokeWidth="2" strokeDasharray="4,3" opacity="0.8"/>
                </svg>
                <div style={{textAlign:"center",zIndex:1}}>
                  <div style={{fontSize:"9px",color:AC,fontFamily:"'DM Mono',monospace"}}>MAP PREVIEW</div>
                  <div style={{fontSize:"9px",color:"rgba(255,255,255,0.3)",marginTop:"4px"}}>Interactive in full OS</div>
                </div>
              </div>
              <div style={{display:"flex",gap:"6px"}}>
                {["Home — 12 min","Work — 28 min","Last Visited"].map(d=>(
                  <div key={d} style={{flex:1,padding:"6px",borderRadius:"8px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",fontSize:"8px",color:"rgba(255,255,255,0.5)",fontFamily:"'DM Mono',monospace",textAlign:"center"}}>{d}</div>
                ))}
              </div>
            </div>
          )}
          {tab==="music"&&(
            <div style={{display:"flex",flexDirection:"column",gap:"10px",height:"100%"}}>
              <div style={{display:"flex",gap:"10px",flex:1}}>
                <div style={{width:"68px",height:"68px",borderRadius:"10px",background:"linear-gradient(135deg,#1a0a2e,#0d1f3c)",border:"1px solid rgba(255,255,255,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"22px",flexShrink:0}}>♪</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:"13px",fontWeight:"700",color:"rgba(255,255,255,0.9)",marginBottom:"2px"}}>Darkside</div>
                  <div style={{fontSize:"10px",color:"rgba(255,255,255,0.35)",marginBottom:"8px",fontFamily:"'DM Mono',monospace"}}>Alan Walker · Different World</div>
                  <div style={{height:"2px",background:"rgba(255,255,255,0.06)",borderRadius:"2px"}}>
                    <div style={{width:"42%",height:"100%",background:AC,borderRadius:"2px"}}/>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",marginTop:"3px"}}>
                    <span style={{fontSize:"8px",color:"rgba(255,255,255,0.25)",fontFamily:"'DM Mono',monospace"}}>1:47</span>
                    <span style={{fontSize:"8px",color:"rgba(255,255,255,0.25)",fontFamily:"'DM Mono',monospace"}}>4:14</span>
                  </div>
                </div>
              </div>
              <div style={{display:"flex",justifyContent:"center",gap:"16px"}}>
                {["⏮","⏸","⏭"].map(c=>(
                  <button key={c} style={{width:"34px",height:"34px",borderRadius:"50%",background:c==="⏸"?"rgba(0,220,180,0.2)":"rgba(255,255,255,0.04)",border:`1px solid ${c==="⏸"?"rgba(0,220,180,0.4)":"rgba(255,255,255,0.08)"}`,color:"rgba(255,255,255,0.7)",fontSize:"12px"}}>{c}</button>
                ))}
              </div>
            </div>
          )}
          {tab==="climate"&&(
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",height:"100%"}}>
              {[{label:"DRIVER",temp:"22°C",fan:"3"},{label:"PASSENGER",temp:"21°C",fan:"2"}].map(z=>(
                <div key={z.label} style={{borderRadius:"10px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",padding:"14px",display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
                  <div style={{fontSize:"8px",color:"rgba(255,255,255,0.25)",fontFamily:"'DM Mono',monospace"}}>{z.label}</div>
                  <div style={{fontSize:"28px",fontWeight:"800",color:"#fff"}}>{z.temp}</div>
                  <div style={{fontSize:"8px",color:AC,fontFamily:"'DM Mono',monospace"}}>FAN {z.fan} ● AC ON</div>
                </div>
              ))}
              <div style={{gridColumn:"span 2",borderRadius:"10px",background:"rgba(0,220,180,0.04)",border:"1px solid rgba(0,220,180,0.1)",padding:"10px",textAlign:"center",fontSize:"8px",color:AC,fontFamily:"'DM Mono',monospace"}}>AUTO CLIMATE — AI OPTIMIZED</div>
            </div>
          )}
        </div>
      </div>
      <div style={{width:"17%",borderLeft:"1px solid rgba(255,255,255,0.05)",padding:"12px 10px",display:"flex",flexDirection:"column",gap:"10px",background:"rgba(0,0,0,0.2)"}}>
        <div style={{fontSize:"7px",color:"rgba(255,255,255,0.2)",fontFamily:"'DM Mono',monospace",letterSpacing:"0.12em"}}>QUICK ACCESS</div>
        {[{icon:"🔊",label:"Vol 72"},{icon:"❄️",label:"22°C"},{icon:"📍",label:"GPS"},{icon:"📱",label:"Phone"},{icon:"⚙️",label:"Settings"}].map(item=>(
          <div key={item.label} style={{padding:"7px",borderRadius:"8px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",textAlign:"center"}}>
            <div style={{fontSize:"13px",marginBottom:"2px"}}>{item.icon}</div>
            <div style={{fontSize:"7px",color:"rgba(255,255,255,0.3)",fontFamily:"'DM Mono',monospace"}}>{item.label}</div>
          </div>
        ))}
        <div style={{marginTop:"auto",textAlign:"center"}}>
          <div style={{width:"8px",height:"8px",borderRadius:"50%",background:AC,boxShadow:`0 0 8px ${AC}`,margin:"0 auto 4px",animation:"pulse 2s ease-in-out infinite"}}/>
          <div style={{fontSize:"6px",color:AC,fontFamily:"'DM Mono',monospace"}}>VELOX LIVE</div>
        </div>
      </div>
    </div>
  );
};

const S1=()=>(
  <div>
    <SH number="01" title="OS Vision & Philosophy" subtitle="Naming the feeling before naming the product"/>
    <div style={{marginBottom:"16px"}}>
      <div style={{fontSize:"9px",color:AC,fontFamily:"'DM Mono',monospace",letterSpacing:"0.2em",marginBottom:"8px"}}>INTERACTIVE UI PREVIEW</div>
      <MockUI/>
      <div style={{fontSize:"9px",color:"rgba(255,255,255,0.2)",fontFamily:"'DM Mono',monospace",marginTop:"8px",textAlign:"center"}}>Click tabs above to explore the VELOX interface concept</div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"12px",marginBottom:"24px"}}>
      {[{name:"VELOX",meaning:"Latin for 'fast, swift'",why:"Primal. Memorable. Global."},{name:"MERIDIAN",meaning:"Peak of the sky",why:"Premium positioning, timeless."},{name:"KIRA OS",meaning:"'Shining' in Japanese",why:"Aesthetic, aspirational."}].map(n=>(
        <Card key={n.name} accent={n.name==="VELOX"} glow={n.name==="VELOX"}>
          <div style={{fontSize:"18px",fontWeight:"800",color:n.name==="VELOX"?AC:"rgba(255,255,255,0.7)",fontFamily:"'Syne',sans-serif",marginBottom:"6px"}}>{n.name}</div>
          <div style={{fontSize:"11px",color:"rgba(255,255,255,0.4)",fontFamily:"'DM Mono',monospace",marginBottom:"8px"}}>{n.meaning}</div>
          <div style={{fontSize:"12px",color:"rgba(255,255,255,0.6)"}}>{n.why}</div>
          {n.name==="VELOX"&&<div style={{marginTop:"10px",fontSize:"9px",color:AC,fontFamily:"'DM Mono',monospace"}}>★ RECOMMENDED</div>}
        </Card>
      ))}
    </div>
    <Card style={{marginBottom:"24px"}}>
      <h3 style={{fontSize:"16px",fontWeight:"700",color:"rgba(255,255,255,0.9)",fontFamily:"'Syne',sans-serif",marginBottom:"14px"}}>Brand Philosophy: "Motion as Emotion"</h3>
      <p style={{fontSize:"13px",color:"rgba(255,255,255,0.55)",lineHeight:"1.8",marginBottom:"12px"}}>VELOX is not software. It is the <H>emotional architecture of movement</H>. Every pixel, animation, and sound exists for one purpose: to make the driver feel they are piloting something genuinely extraordinary. Not a $200 Android stereo. A <H>living, breathing cockpit</H> that responds to the driver's world.</p>
      <p style={{fontSize:"13px",color:"rgba(255,255,255,0.55)",lineHeight:"1.8"}}>Apple's philosophy: "technology for humans." Tesla's: "software-defined car." VELOX's: <H>"The journey is the product."</H> Every commute should feel cinematic. Every road trip should feel epic.</p>
    </Card>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
      <Card>
        <h4 style={{fontSize:"13px",fontWeight:"700",color:"rgba(255,255,255,0.8)",fontFamily:"'Syne',sans-serif",marginBottom:"12px"}}>Why Users Would Switch</h4>
        {["Android Auto feels like a borrowed app, not a cockpit","CarPlay is brilliant — but locked to Apple hardware forever","OEM systems are slow, ugly, and never get updated","VELOX is the first system that LEARNS you","Zero-lag touch that matches $1,500 flagship phones","Cinematic UI that makes the whole car feel premium"].map(r=>(
          <div key={r} style={{display:"flex",gap:"9px",marginBottom:"8px",alignItems:"flex-start"}}>
            <span style={{color:AC,fontSize:"10px",marginTop:"3px",flexShrink:0}}>→</span>
            <span style={{fontSize:"12px",color:"rgba(255,255,255,0.55)",lineHeight:"1.5"}}>{r}</span>
          </div>
        ))}
      </Card>
      <Card>

function App(){

  const [scrolled,setScrolled]=useState(false);
  const [animKey,setAnimKey]=useState(0);

  useEffect(()=>{
    const el=ref.current;
    if(!el)return;
    const h=()=>setScrolled(el.scrollTop>20);
    el.addEventListener("scroll",h);
    return()=>el.removeEventListener("scroll",h);
  },[]);
  const go=(id)=>{setActive(id);setAnimKey(k=>k+1);if(ref.current)ref.current.scrollTo({top:0,behavior:"smooth"});};
  const ActiveSection=SM[active];
  return(
    <div style={{display:"flex",height:"100vh",width:"100%",background:"#040810",overflow:"hidden"}}>

            </button>
          ))}
        </nav>
        <div style={{padding:"12px 16px",borderTop:"1px solid rgba(255,255,255,0.05)"}}>

        </div>
